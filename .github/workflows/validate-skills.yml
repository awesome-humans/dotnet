name: Validate skills and opinions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Set explicitly rather than inherited: the GitHub runner image puts NOLOGO in
# /etc/environment but only exports the telemetry opt-out while installing the SDK,
# so a job gets the quiet banner but still sends telemetry. Declaring both here also means
# a self-hosted runner behaves the same as a GitHub-hosted one.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pin just to a release that was at least two weeks old when picked. The steps below
      # call its recipes, never dotnet or the scripts directly, because the justfile holds
      # every entry point.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0

      - name: Verify script permissions match their shebangs
        run: just check-script-permissions

      # Python only for skills-ref: the Agent Skills specification's own reference
      # validator, published only to PyPI.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install skills-ref
        run: pip install -r .github/requirements.txt

      # global.json sets the minimum SDK and how far it rolls forward, per
      # opinions/ci.md.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Validate skills against the Agent Skills spec
        run: just validate-skills

      - name: Verify resource metadata
        run: just validate-metadata

      - name: Verify the roster and the sources cited against it
        run: just validate-sources

      - name: Verify README indexes every opinion and skill
        run: just validate-readme-index

      - name: Verify template package entries are sorted
        run: just validate-template-order

      # The README shows the committed SVGs, so they can drift from the script that draws
      # them. Redraw every diagram, and fail on any difference, including one never committed.
      - name: Verify the diagrams match the script that draws them
        run: just check-diagrams
