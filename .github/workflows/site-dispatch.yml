name: Site dispatch

# Notifies awesome-humans/website when main changes, so its Site workflow rebuilds
# awesome-humans.net with the new /dotnet/ pages. The dispatch sends no content:
# website fetches every ecosystem at main itself.
#
# It sends the dispatch as the organisation's awesome-humans-app, with a short-lived token
# limited to the website repository. The APP_CLIENT_ID variable and APP_PRIVATE_KEY
# secret are set on the organisation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an app token for website
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: awesome-humans
          repositories: website
          permission-contents: write

      - name: Send ecosystem-updated to website
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api repos/awesome-humans/website/dispatches --input - <<EOF
          {"event_type": "ecosystem-updated", "client_payload": {"ecosystem": "dotnet", "sha": "$GITHUB_SHA"}}
          EOF
