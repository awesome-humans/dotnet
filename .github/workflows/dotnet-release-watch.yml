# Watches the official .NET releases index for new GA releases, and opens a pull
# request when the known state changes. The runtime, ASP.NET Core, and the SDK ship
# together per channel.
#
# The pull request is a TRIGGER, not the update: it refreshes only
# .github/state/dotnet-releases.json. To fold the release into opinions/ and templates/,
# run the refresh-dotnet-versions skill against the pull request's branch.
#
# Note: for the create-pull-request step to work, the repository setting
# "Allow GitHub Actions to create and approve pull requests" must be enabled
# (Settings → Actions → General → Workflow permissions).
name: .NET release watch

on:
  schedule:
    - cron: "0 6 * * *" # daily; .NET GA releases land on Patch Tuesday and in November
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The shell steps only read downloaded data, and create-pull-request authenticates
        # with its own token input, so the job token stays out of .git/config.
        with:
          persist-credentials: false

      # pipefail is set explicitly: the default shell for an unqualified `run` is
      # `bash -e`, which reports only the LAST command in a pipeline. Without it a failed
      # fetch leaves jq reading empty stdin, which it turns into no output and exit 0.
      # The diff below would read that truncated snapshot as "every channel removed",
      # and open a trigger pull request that deletes the state file instead of updating it.
      - name: Snapshot GA release state
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/dotnet/core/main/release-notes/releases-index.json \
          | jq '{channels: [.["releases-index"][]
              | select(.["support-phase"] == "active" or .["support-phase"] == "maintenance")
              | {channel: .["channel-version"],
                 "release-type": .["release-type"],
                 "support-phase": .["support-phase"],
                 "latest-release": .["latest-release"],
                 "latest-release-date": .["latest-release-date"],
                 "latest-runtime": .["latest-runtime"],
                 "latest-sdk": .["latest-sdk"]}]}' \
          > "$snapshot"

          # Guard against a fetch that succeeds but returns something unexpected:
          # replace the checked-in file only once the new one parses and carries channels.
          # An empty or unparseable snapshot fails the run loudly instead of opening a pull
          # request.
          channels="$(jq '.channels | length' "$snapshot" 2>/dev/null || echo 0)"
          case "$channels" in
            0 | '' | *[!0-9]*)
              echo "Release index fetch produced no usable channel count (got '$channels'). Leaving the snapshot untouched." >&2
              exit 1
              ;;
          esac

          mv "$snapshot" .github/state/dotnet-releases.json

      - name: Summarize changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/state/dotnet-releases.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Random delimiter, because the summary is remote content: a diff line reading
            # exactly the delimiter would close the block early and let the rest be parsed
            # as further step outputs (opinions/ci.md on never interpolating input).
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "summary<<$delimiter"
              git diff -- .github/state/dotnet-releases.json | grep -E '^[+-] ' || true
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open trigger PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: automation/dotnet-release-watch
          title: "chore: new .NET GA release detected"
          commit-message: "chore: update .NET GA release snapshot"
          labels: dotnet-release
          body: |
            The [.NET releases index](https://github.com/dotnet/core/blob/main/release-notes/releases-index.json) has changed since the last snapshot.

            ```diff
            ${{ steps.diff.outputs.summary }}
            ```

            **This pull request doesn't update the opinions or templates.** It only refreshes `.github/state/dotnet-releases.json`. To bring them up to date, run the [`refresh-dotnet-versions`](../blob/main/skills/refresh-dotnet-versions/SKILL.md) skill on this branch, and merge its changes with the snapshot in this pull request.
