name: Site

# Builds the awesome-humans.net documentation site on every pull request and deploys it
# to Cloudflare. The site's /dotnet/ pages are generated from opinions/, templates/, the
# roster and README.md, so any change to those can break it, not only a change under
# site/. A push to main deploys to awesome-humans.net; a pull request uploads a preview
# version at its own URL without touching the live site.
#
# Deploying is a job of its own so that it can declare a GitHub environment: production
# for main, preview for a pull request. GitHub then shows a View deployment link on the
# pull request and lists each deploy on the repository's Deployments page.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Set explicitly rather than inherited; see validate-skills.yml for why.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# One deployment at a time per branch, and a newer push replaces a queued one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deployable.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # global.json decides the SDK, per opinions/ci.md.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"

      - name: Install Zensical
        run: pip install -r site/requirements.txt

      - name: Stage the site
        run: dotnet run scripts/build-site.cs

      # --strict fails the build on a link or anchor that resolves to nothing, which
      # catches a link build-site.cs rewrote wrongly as well as one broken at source.
      - name: Build the site
        run: zensical build --strict -f site/build/zensical.toml

      # A job's if cannot read secrets, so this step decides for the deploy job. Secrets
      # are empty for a pull request from a fork, and the site builds there without
      # deploying. A push to a branch other than main, by workflow_dispatch, never deploys.
      - name: Decide whether to deploy
        id: deployable
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          DEPLOYABLE_EVENT: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$DEPLOYABLE_EVENT" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the built site for the deploy job
        if: steps.deployable.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/build/public
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      # A preview links its alias URL, which stays the same across the pull request's
      # pushes, and falls back to the version URL. Production is the custom domain,
      # which wrangler deploy does not report as a URL.
      url: ${{ steps.alias.outputs.url || (github.event_name != 'pull_request' && 'https://awesome-humans.net/') || steps.wrangler.outputs.deployment-url }}
    steps:
      # For site/wrangler.jsonc; the built site comes from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/build/public

      # wranglerVersion pins Wrangler itself, which the action would otherwise take as
      # whatever v4 is latest. Renovate does not track this input, so bump it by hand.
      - name: Deploy with Wrangler
        id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          workingDirectory: site
          command: ${{ github.event_name == 'pull_request' && format('versions upload --preview-alias pr-{0}', github.event.pull_request.number) || 'deploy' }}

      # wrangler-action v4.1.3 has no output for the alias URL, only Wrangler's printed
      # "Version Preview Alias URL" line, which may carry terminal colour codes.
      - name: Read the preview alias URL
        id: alias
        if: github.event_name == 'pull_request'
        env:
          OUTPUT: ${{ steps.wrangler.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/.*Version Preview Alias URL: *\(https:[^[:space:]]*\).*/\1/p' | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
