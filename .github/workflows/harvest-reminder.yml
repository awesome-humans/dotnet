name: Harvest reminder

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open harvest reminder issue (skip if one already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          title="Harvest due: $(date -u '+%B %Y')"

          # Capture gh's output in a variable, not a pipe, so set -e stops the job if gh fails.
          # In a pipe into grep, the || true would hide that failure, the count would read 0,
          # and the job would open a duplicate issue.
          titles=$(gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title')
          existing=$(printf '%s\n' "$titles" | grep -Fxc "$title" || true)
          if [ "${existing:-0}" -gt 0 ]; then
            echo "Open issue titled '$title' already exists — skipping."
            exit 0
          fi

          url="https://github.com/${GH_REPO}/blob/main"
          body=$(cat <<EOF
          The monthly source harvest is due.

          Run the [\`harvest-sources\` skill](${url}/skills/harvest-sources/SKILL.md). It checks each source in AWESOME-HUMANS.md for posts since the last harvest, and folds new guidance into the opinions.

          The decision log in [AWESOME-HUMANS.md](${url}/AWESOME-HUMANS.md) records the date of the last harvest.
          EOF
          )

          gh issue create --title "$title" --body "$body"
