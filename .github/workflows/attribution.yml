name: Attribution

# Fails a pull request whose title, description, or commits carry agent attribution,
# using the organisation's shared check in awesome-humans/.github. pull_request_target
# runs this file from the base branch, so a pull request can't change the check
# that runs on it.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the job never checks out the pull request
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    uses: awesome-humans/.github/.github/workflows/attribution.yml@b3a2dbe9f9daffa607525d51fb9d115baaffaa76 # main
