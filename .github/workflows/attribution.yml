name: Attribution

# Fails a pull request whose title, description, or commits include agent attribution,
# using the organisation's shared check in awesome-humans/.github. pull_request_target
# runs this file from the base branch, so a pull request can't change the check
# that runs on it. The shared job never checks out or runs the pull request's code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the job never checks out the pull request
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    uses: awesome-humans/.github/.github/workflows/attribution.yml@d628410df89402881707256583d14b42a371918c # main
