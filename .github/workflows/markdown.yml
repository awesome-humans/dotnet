name: Markdown

on:
  pull_request:
  # A pull request can only restore caches saved on its own ref or on main, so
  # without a run on main after each merge, every pull request restores the cache
  # from the last weekly run and discards it as older than --max-cache-age.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC. The link check runs on a schedule, not only on
    # pull requests, because links break even when the repository doesn't change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  format-and-lint:
    # Formatting, structure, and spelling are deterministic and offline, so they gate pull
    # requests. On a push to main they would only repeat what the merged pull request
    # already passed.
    if: github.event_name != 'schedule' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Pinned to a release at least two weeks old when chosen. The justfile is every entry
      # point, so the steps below call its recipes, never npm.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just@1.58.0

      # npm ci, not npm install: it honours package-lock.json exactly and fails if the lock
      # and manifest disagree, so CI can't float a version.
      - name: Install the prose tools
        run: just install

      - name: Check formatting
        run: just format-check

      # The token lets zizmor's online audits look up the actions the workflows pin,
      # for known vulnerabilities and for commits that aren't on the action's repository.
      - name: Lint Markdown and the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: just lint

      - name: Check spelling
        run: just spell

  links:
    runs-on: ubuntu-latest
    # Blocking everywhere, pull requests included: the citations in opinions/ and
    # the roster are the substance of this repository, so a dead link is a content
    # defect that shouldn't merge. A third-party host that's down fails an
    # otherwise good pull request. lychee.toml keeps that rare with retries, a browser
    # user agent, and 403 and 429 accepted. Re-run the job once the host
    # recovers, instead of merging past it.
    # audit-freshness reads this workflow's result as its link-health signal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Restore lychee's result cache, so a run doesn't request every host again.
      # The action has no cache input of its own, so this is the supported way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress --cache --max-cache-age 1d .
          fail: true
