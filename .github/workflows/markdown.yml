name: Markdown

on:
  pull_request:
  # A pull request can only restore caches saved on its own ref or on main, so
  # without a run on main after each merge, every pull request restores the cache
  # from the last weekly run and discards it as older than --max-cache-age.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC. The link check runs on a schedule, not only on
    # pull requests, because links break even when the repository doesn't change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  format-and-lint:
    # Formatting, structure, and spelling are deterministic and offline, so they gate pull
    # requests. On a push to main they would only repeat what the merged pull request
    # already passed.
    if: github.event_name != 'schedule' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Pin just to a release that was at least two weeks old when picked. The steps below
      # call its recipes, never npm, because the justfile holds every entry point.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0

      # just install runs npm ci, not npm install. It installs only what package-lock.json
      # pins, and fails if package.json has drifted from it.
      - name: Install the prose tools
        run: just install

      - name: Check formatting
        run: just format-check

      # The token lets zizmor's online audits look up the actions the workflows pin,
      # for known vulnerabilities and for commits that aren't on the action's repository.
      - name: Lint Markdown and the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: just lint

      - name: Check spelling
        run: just spell

  links:
    runs-on: ubuntu-latest
    # A broken link fails every run, pull requests included. The citations in opinions/
    # and the roster are what the repository provides, so a dead one is a content defect.
    # A third-party host that's down can fail a good pull request too. lychee.toml makes
    # that rare with retries, a browser user agent, and accepting 403 and 429. When it
    # happens, re-run the job once the host recovers, instead of merging past it.
    # audit-freshness reads this workflow's result as its link-health signal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Restore lychee's result cache, so a run doesn't request every host again.
      # lychee-action has no cache input, so this step follows the setup in its README.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --no-progress --cache --max-cache-age 1d .
          fail: true
