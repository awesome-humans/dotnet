name: Site preview

# Builds the whole awesome-humans.net site with this pull request's head commit as the
# /dotnet/ section and every other ecosystem at main, and deploys it as a preview at its
# own URL. awesome-humans/website owns the build and the deploy; this repository only
# stages its pages, as AGENTS.md: Site describes. A pull request from a fork builds
# without deploying, because it gets no secrets.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request replaces a queued preview.
concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: awesome-humans/website/.github/workflows/build.yml@d7f5e944c082f05d611fec00b233e2bb290afdee # main
    with:
      ecosystem: dotnet
      ref: ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: build
    uses: awesome-humans/website/.github/workflows/deploy.yml@d7f5e944c082f05d611fec00b233e2bb290afdee # main
    with:
      preview-alias: pr-dotnet-${{ github.event.pull_request.number }}
    secrets: inherit
