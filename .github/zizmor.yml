# Configuration for zizmor, which audits the workflows for security problems.
# CI runs it in the format-and-lint job, through just lint.
rules:
  ref-version-mismatch:
    ignore:
      # Both uses: pin website's main, which moves several times a day, and Renovate
      # bumps the digest weekly. Between bumps the # main comment always lags, so
      # the check would fail every pull request for a change outside it.
      - site-preview.yml
