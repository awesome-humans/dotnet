# Configuration for zizmor, which audits the workflows for security problems.
# CI runs it in the format-and-lint job, through just lint.
rules:
  ref-version-mismatch:
    ignore:
      # site-preview.yml pins website's workflows to a commit on main, commented # main.
      # Renovate bumps the pin weekly, but main moves several times a day, so the pin is
      # rarely main's head, and the check would fail every pull request over a change
      # made in website.
      - site-preview.yml
