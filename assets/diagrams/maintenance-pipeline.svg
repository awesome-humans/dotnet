<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1148 770"><title id="title">Maintenance pipeline</title><desc id="desc">Swimlane diagram of how this repository maintains itself: vet-source, research-topic, resolve-research, harvest-sources, refresh-dotnet-versions and weave-house-opinion each work on their own branch, pass CI and the owner's review, and land in the roster, research/ or the opinions and templates; audit-freshness and verify-project only report. Their findings, the release watch and the harvest reminder start the next run.</desc><style>
svg { --bg: #ffffff; --surface: #f6f7f8; --band: #eef0f2; --fg: #0d1117; --muted: #5b6572; --line: #e3e6ea;
  --accent: #087d4e; --human: #9a6100; --auto: #087d4e;
  --sources: var(--accent); --research: var(--accent); --opinions: var(--accent); --reports: var(--muted); }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --surface: #151a21; --band: #1c232c; --fg: #e8ecf0; --muted: #8b95a1; --line: #2a323c;
  --accent: #3dd392; --human: #f2c14e; --auto: #3dd392;
  --sources: var(--accent); --research: var(--accent); --opinions: var(--accent); --reports: var(--muted); } }

.t, .tb, .ts, .gate-t, .check-t { font-family: "IBM Plex Sans", "Segoe UI", "Noto Sans", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
.tm, .th { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", "DejaVu Sans Mono", Menlo, monospace; }.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font-weight: 500; font-size: 14px; }
.tb { fill: var(--fg); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.tm { fill: var(--fg); font-weight: 600; font-size: 14px; }
.ts { fill: var(--muted); font-weight: 400; font-size: 13px; }
.th { fill: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font-weight: 600; font-size: 13px; }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font-weight: 600; font-size: 13px; }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1148" height="770" rx="10" class="bg"/><text x="12" y="24" class="th" text-anchor="start">lane</text><text x="136" y="24" class="th" text-anchor="start">picks up</text><text x="342" y="24" class="th" text-anchor="start">skill</text><text x="604" y="24" class="th" text-anchor="start">agent gate</text><text x="757" y="24" class="th" text-anchor="start">human gate</text><text x="934" y="24" class="th" text-anchor="start">lands in</text><rect x="12" y="44" width="104" height="64" rx="6" fill="var(--sources)" opacity=".14"/><rect x="12" y="44" width="4" height="64" rx="2" fill="var(--sources)"/><text x="26" y="81" class="tb" text-anchor="start">Sources</text><rect x="12" y="134" width="104" height="136" rx="6" fill="var(--research)" opacity=".14"/><rect x="12" y="134" width="4" height="136" rx="2" fill="var(--research)"/><text x="26" y="207" class="tb" text-anchor="start">Research</text><rect x="12" y="296" width="104" height="208" rx="6" fill="var(--opinions)" opacity=".14"/><rect x="12" y="296" width="4" height="208" rx="2" fill="var(--opinions)"/><text x="26" y="405" class="tb" text-anchor="start">Opinions</text><rect x="12" y="530" width="104" height="136" rx="6" fill="var(--reports)" opacity=".14"/><rect x="12" y="530" width="4" height="136" rx="2" fill="var(--reports)"/><text x="26" y="603" class="tb" text-anchor="start">Reports</text><rect x="136" y="50" width="180" height="52" rx="6" class="chip"/><text x="148" y="71.5" class="t" text-anchor="start">candidate source,</text><text x="148" y="88.5" class="t" text-anchor="start">or a standing change</text><line x1="316" y1="76" x2="340" y2="76" class="edge" marker-end="url(#ah)"/><rect x="342" y="48" width="236" height="56" rx="6" class="box"/><rect x="342" y="48" width="4" height="56" rx="2" fill="var(--sources)"/><t