<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1086 504"><title id="title">Source standing</title><desc id="desc">Flow diagram: vet-source sorts a candidate source into citable, with two years of writing and all four criteria; the watch list, under two years or dormant; or declined. A citable source is unmarked, marked Corroborate and never the only citation on a claim, or marked Discovery-only and never cited. Citable and watch-listed sources go back through vet-source when they go dormant, drop in quality, or clear a blocker.</desc><style>
svg { --bg: #ffffff; --surface: #f6f7f8; --band: #eef0f2; --fg: #0d1117; --muted: #5b6572; --line: #e3e6ea;
  --accent: #087d4e; --human: #9a6100; --auto: #087d4e;
  --sources: #017b80; --research: #6d7123; --opinions: #955080; --reports: #8253ac; }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --surface: #151a21; --band: #1c232c; --fg: #e8ecf0; --muted: #8b95a1; --line: #2a323c;
  --accent: #3dd392; --human: #f2c14e; --auto: #3dd392;
  --sources: #6ac9ce; --research: #b9be71; --opinions: #e79bce; --reports: #c9a5e9; } }

.t, .tb, .ts, .gate-t, .check-t { font-family: "IBM Plex Sans", "Segoe UI", "Noto Sans", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
.tm, .th { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", "DejaVu Sans Mono", Menlo, monospace; }.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font-weight: 500; font-size: 16px; }
.tb { fill: var(--fg); font-weight: 600; font-size: 16px; }
.tm { fill: var(--fg); font-weight: 600; font-size: 15px; }
.ts { fill: var(--muted); font-weight: 400; font-size: 14px; }
.th { fill: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font-weight: 600; font-size: 14px; }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font-weight: 600; font-size: 14px; }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1086" height="504" rx="10" class="bg"/><rect x="20" y="20" width="232" height="64" rx="8" class="box"/><text x="36" y="48" class="tb" text-anchor="start">Candidate source</text><text x="36" y="69" class="ts" text-anchor="start">blog, docs, book, newsletter</text><line x1="136" y1="84" x2="136" y2="156" class="edge" marker-end="url(#ah)"/><path d="M136 158L174 196L136 234L98 196z" class="decision"/><text x="148" y="124" class="tm" text-anchor="start">vet-source</text><text x="136" y="200" class="ts" text-anchor="middle">criteria</text><line x1="174" y1="196" x2="276" y2="196" class="edge"/><rect x="508" y="20" width="416" height="252" rx="8" class="box"/><rect x="508" y="20" width="4" height="252" rx="2" fill="var(--accent)"/><text x="524" y="47" class="tb" text-anchor="start">Citable</text><text x="524" y="68" class="ts" text-anchor="start">quotable in opinions and templates, within its marking</text><rect x="524" y="84" width="384" height="52" rx="6" class="chip"/><text x="536" y="106" class="tm" text-anchor="start">unmarked</text><text x="536" y="126" class="ts" text-anchor="start">may carry a claim alone</text><rect x="524" y="144" width="384" height="52" rx="6" class="chip"/><text x="536" y="166" class="tm" text-anchor="start">**Corroborate.**</text><text x="536" y="186" class="ts" text-anchor="start">cited, never as the only source on a claim</text><rect x="524" y="204" width="384" height="52" rx="6" class="chip"/><text x="536" y="226" class="tm" text-anchor="start">**Discovery-only.**</text><text x="536" y="246" class="ts" text-anchor="start">never cited, only followed to its primary source</text><rect x="508" y="296" width="416" height="60" rx="8" class="ext"/><text x="524" y="322" class="tb" text-anchor="start">Watch list</text><text x="524" y="343" class="ts" text-anchor="start">leads only, never cited</text><rect x="508" y="380" width="416" height="60" rx="8" class="ext"/><text x="524" y="406" class="tb" text-anchor="start">Declined</text><text x="524" y="427" class="ts" text-anchor="start">off the roster, the decision logged</text><path d="M276 196V52H506" class="edge" marker-end="url(#ah)"/><text x="288" y="44" class="ts" text-anchor="start">two years and all four criteria</text><path d="M276 196V326H506" class="edge" marker-end="url(#ah)"/><text x="288" y="318" class="ts" text-anchor="start">under two years, or dormant</text><path d="M276 196V410H506" class="edge" marker-end="url(#ah)"/><text x="288" y="402" class="ts" text-anchor="start">otherwise</text><path d="M924 52H1066V476" class="edge dash"/><path d="M924 326H1066" class="edge dash"/><path d="M1066 476H136V236" class="edge dash" marker-end="url(#ah)"/><text x="934" y="44" class="ts" text-anchor="start">dormant, weaker</text><text x="934" y="318" class="ts" text-anchor="start">blocker clears</text><text x="601" y="468" class="ts" text-anchor="middle">re-vetted: standing is never permanent</text></svg>
