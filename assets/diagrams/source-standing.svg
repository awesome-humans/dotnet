<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 440"><title id="title">Source standing</title><desc id="desc">Flow diagram: vet-source sorts a candidate source into citable, with two years of writing and all four criteria; the watch list, under two years or dormant; or declined. A citable source is unmarked, marked Corroborate and never the only citation on a claim, or marked Discovery-only and never cited. Citable and watch-listed sources go back through vet-source when they go dormant, drop in quality, or clear a blocker.</desc><style>
svg { --bg: #ffffff; --surface: #f6f7f8; --band: #eef0f2; --fg: #0d1117; --muted: #5b6572; --line: #e3e6ea;
  --accent: #087d4e; --human: #9a6100; --auto: #087d4e;
  --sources: var(--accent); --research: var(--accent); --opinions: var(--accent); --reports: var(--muted); }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --surface: #151a21; --band: #1c232c; --fg: #e8ecf0; --muted: #8b95a1; --line: #2a323c;
  --accent: #3dd392; --human: #f2c14e; --auto: #3dd392;
  --sources: var(--accent); --research: var(--accent); --opinions: var(--accent); --reports: var(--muted); } }

.t, .tb, .ts, .gate-t, .check-t { font-family: "IBM Plex Sans", "Segoe UI", "Noto Sans", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
.tm, .th { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", "DejaVu Sans Mono", Menlo, monospace; }.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font-weight: 500; font-size: 14px; }
.tb { fill: var(--fg); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.tm { fill: var(--fg); font-weight: 600; font-size: 14px; }
.ts { fill: var(--muted); font-weight: 400; font-size: 13px; }
.th { fill: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font-weight: 600; font-size: 13px; }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font-weight: 600; font-size: 13px; }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1290" height="440" rx="10" class="bg"/><rect x="24" y="150" width="212" height="64" rx="8" class="box"/><text x="40" y="179" class="tb" text-anchor="start">Candidate source</text><text x="40" y="197" class="ts" text-anchor="start">blog, docs, book, newsletter</text><line x1="236" y1="182" x2="270" y2="182" class="edge" marker-end="url(#ah)"/><path d="M308 146L344 182L308 218L272 182z" class="decision"/><text x="308" y="134" class="tm" text-anchor="middle">vet-source</text><text x="308" y="186" class="ts" text-anchor="middle">criteria</text><line x1="344" y1="182" x2="376" y2="182" class="edge"/><rect x="606" y="24" width="540" height="196" rx="8" class="box"/><rect x="606" y="24" width="4" height="196" rx="2" fill="var(--accent)"/><text x="622" y="50" class="tb" text-anchor="start">Citable</text><text x="622" y="68" class="ts" text-anchor="start">quotable in opinions and templates, within its marking</text><rect x="622" y="84" width="508" height="36" rx="6" class="chip"/><text x="634" y="107" class="tm" text-anchor="start">unmarked</text><text x="818" y="107" class="ts" text-anchor="start">may carry a claim alone</text><rect x="622" y="128" width="508" height="36" rx="6" class="chip"/><text x="634" y="151" class="tm" text-anchor="start">**Corroborate.**</text><text x="818" y="151" class="ts" text-anchor="start">cited, never as the only source on a claim</text><rect x="622" y="172" width="508" height="36" rx="6" class="chip"/><text x="634" y="195" class="tm" text-anchor="start">**Discovery-only.**</text><text x="818" y="195" class="ts" text-anchor="start">never cited, only followed to its primary source</text><rect x="606" y="244" width="540" height="56" rx="8" class="ext"/><text x="622" y="269" class="tb" text-anchor="start">Watch list</text><text x="622" y="287" class="ts" text-anchor="start">leads only, never cited</text><rect x="606" y="324" width="540" height="56" rx="8" class="ext"/><text x="622" y="349" class="tb" text-anchor="start">Declined</text><text x="622" y="367" class="ts" text-anchor="start">off the roster, the decision logged</text><path d="M376 182V56H604" class="edge" marker-end="url(#ah)"/><text x="388" y="48" class="ts" text-anchor="start">two years and all four criteria</text><path d="M376 182V272H604" class="edge" marker-end="url(#ah)"/><text x="388" y="264" class="ts" text-anchor="start">under two years, or dormant</text><path d="M376 182V352H604" class="edge" marker-end="url(#ah)"/><text x="388" y="344" class="ts" text-anchor="start">otherwise</text><path d="M1146 56H1270V412" class="edge dash"/><path d="M1146 272H1270" class="edge dash"/><path d="M1270 412H308V220" class="edge dash" marker-end="url(#ah)"/><text x="1156" y="48" class="ts" text-anchor="start">dormant, weaker</text><text x="1156" y="264" class="ts" text-anchor="start">blocker clears</text><text x="789" y="404" class="ts" text-anchor="middle">re-vetted: standing is never permanent</text></svg>
