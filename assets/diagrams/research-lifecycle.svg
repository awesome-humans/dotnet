<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138 342"><title id="title">Research lifecycle</title><desc id="desc">Flow diagram: research-topic opens a pull request that saves research/&lt;topic&gt;.md; resolve-research then promotes it into the opinions and templates, discards it, or promotes part of it, deleting the topic in the same pull request. A blocked remainder stays staged and goes back through resolve-research once vet-source clears the source it waits on.</desc><style>
svg { --bg: #ffffff; --surface: #f6f7f8; --band: #eef0f2; --fg: #0d1117; --muted: #5b6572; --line: #e3e6ea;
  --accent: #087d4e; --human: #9a6100; --auto: #087d4e;
  --sources: #017b80; --research: #955080; --opinions: #6d7123; --reports: var(--muted); }
@media (prefers-color-scheme: dark) { svg { --bg: #0d1117; --surface: #151a21; --band: #1c232c; --fg: #e8ecf0; --muted: #8b95a1; --line: #2a323c;
  --accent: #3dd392; --human: #f2c14e; --auto: #3dd392;
  --sources: #6ac9ce; --research: #e79bce; --opinions: #b9be71; --reports: var(--muted); } }

.t, .tb, .ts, .gate-t, .check-t { font-family: "IBM Plex Sans", "Segoe UI", "Noto Sans", "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
.tm, .th { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, "Noto Sans Mono", "DejaVu Sans Mono", Menlo, monospace; }.bg { fill: var(--bg); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.chip { fill: var(--band); stroke: none; }
.ext { fill: var(--band); stroke: var(--muted); stroke-width: 1.2; }
.store { fill: var(--band); stroke: var(--line); stroke-width: 1.2; }
.t { fill: var(--fg); font-weight: 500; font-size: 16px; }
.tb { fill: var(--fg); font-weight: 600; font-size: 16px; }
.tm { fill: var(--fg); font-weight: 600; font-size: 15px; }
.ts { fill: var(--muted); font-weight: 400; font-size: 14px; }
.th { fill: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.edge { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.edge.dash { stroke-dasharray: 4 4; }
.arrowhead { fill: var(--muted); }
.gate { fill: var(--surface); stroke: var(--human); stroke-width: 2; }
.gate-t { fill: var(--human); font-weight: 600; font-size: 14px; }
.check { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
.check-t { fill: var(--auto); font-weight: 600; font-size: 14px; }
.decision { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }

</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect width="1138" height="342" rx="10" class="bg"/><rect x="20" y="118" width="212" height="64" rx="8" class="box"/><text x="36" y="146" class="tm" text-anchor="start">research-topic</text><text x="36" y="167" class="ts" text-anchor="start">cited, on research/&lt;topic&gt;</text><line x1="232" y1="150" x2="314" y2="150" class="edge" marker-end="url(#ah)"/><text x="274" y="142" class="ts" text-anchor="middle">PR merges</text><rect x="316" y="118" width="204" height="64" rx="8" class="store"/><text x="332" y="146" class="tm" text-anchor="start">research/&lt;topic&gt;.md</text><text x="332" y="167" class="ts" text-anchor="start">on record, unresolved</text><line x1="520" y1="150" x2="576" y2="150" class="edge" marker-end="url(#ah)"/><path d="M616 112L654 150L616 188L578 150z" class="decision"/><text x="616" y="98" class="tm" text-anchor="middle">resolve-research</text><text x="616" y="154" class="ts" text-anchor="middle">own PR</text><line x1="654" y1="150" x2="704" y2="150" class="edge"/><path d="M704 150V74H734" class="edge" marker-end="url(#ah)"/><rect x="736" y="44" width="386" height="60" rx="8" class="box"/><rect x="736" y="44" width="4" height="60" rx="2" fill="var(--accent)"/><text x="752" y="70" class="tb" text-anchor="start">Promote</text><text x="752" y="91" class="ts" text-anchor="start">opinions and templates updated, topic deleted</text><path d="M704 150V150H734" class="edge" marker-end="url(#ah)"/><rect x="736" y="120" width="386" height="60" rx="8" class="ext"/><text x="752" y="146" class="tb" text-anchor="start">Discard</text><text x="752" y="167" class="ts" text-anchor="start">nothing woven, topic deleted</text><path d="M704 150V226H734" class="edge" marker-end="url(#ah)"/><rect x="736" y="196" width="386" height="60" rx="8" class="ext"/><text x="752" y="222" class="tb" text-anchor="start">Partial promotion</text><text x="752" y="243" class="ts" text-anchor="start">the rest woven, the blocked remainder stays staged</text><path d="M929 256V314H616V190" class="edge dash" marker-end="url(#ah)"/><text x="772.5" y="306" class="ts" text-anchor="middle">once vet-source clears its source</text></svg>
